<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uzay Gemisi Haritası Kodları</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05050a; /* Derin uzay siyahı */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #mapCanvas {
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(0, 0, 100, 0.5);
        }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div id="controls">
        <h3>Harita Kodları</h3>
        <p>Hareket etmek için <b>W, A, S, D</b> tuşlarını kullanın.</p>
        <p>Görüntü kalitesi sabittir.</p>
    </div>

    <canvas id="mapCanvas" width="1200" height="600"></canvas>

    <script>
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');

        // Renk Paleti (Görselden alınmıştır)
        const COLORS = {
            space: '#05050a',
            wallOuter: '#3a445d', // Kalın dış çizgi
            wallInner: '#4a5775', // Oda iç çizgileri
            floor: '#1e2433',     // Odaların içi
            floorAlt: '#161a24',  // Koridorlar/Karanlık yerler
            textMain: '#ffeaa7',  // Sarı başlık metni
            textSub: '#ffffff',   // Beyaz alt metin
            vent: '#ff4757',      // Kırmızı üçgen
            task: '#ffeaa7',      // Sarı görev noktası
            engine: '#00d2ff',    // Mavi motor ateşi
            electric: '#ffffff'   // Elektrik sembolü
        };

        // Harita Ölçeği ve Pozisyonu
        let mapScale = 1;
        let mapX = 0;
        let mapY = 0;

        // Basit Oyuncu (Test için)
        let player = { x: 600, y: 300, size: 10, color: 'white' };

        // Klavye Kontrolü
        let keys = {};
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        // --- ÇİZİM FONKSİYONLARI ---

        function drawStarfield() {
            ctx.fillStyle = COLORS.space;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Rastgele yıldızlar
            ctx.fillStyle = "white";
            for(let i=0; i<200; i++) {
                let x = (Math.sin(i * 123.4) * 0.5 + 0.5) * canvas.width;
                let y = (Math.cos(i * 456.7) * 0.5 + 0.5) * canvas.height;
                let size = (Math.sin(i) * 0.5 + 0.5) * 2;
                ctx.fillRect(x, y, size, size);
            }
        }

        // Çokgen veya Oda çizmek için yardımcı fonksiyon
        function drawRoom(points, fillStyle, strokeStyle, lineWidth = 2) {
            if (points.length < 2) return;
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.closePath();
            ctx.fillStyle = fillStyle;
            ctx.fill();
            ctx.strokeStyle = strokeStyle;
            ctx.lineWidth = lineWidth;
            ctx.stroke();
        }

        // Elektrik sembolü çiz (⚡)
        function drawElectricSymbol(x, y, size) {
            ctx.beginPath();
            ctx.moveTo(x, y - size);
            ctx.lineTo(x - size/2, y + size/4);
            ctx.lineTo(x + size/4, y - size/4);
            ctx.lineTo(x, y + size);
            ctx.lineTo(x + size/2, y - size/4);
            ctx.lineTo(x - size/4, y + size/4);
            ctx.closePath();
            ctx.fillStyle = COLORS.electric;
            ctx.fill();
        }

        // Görev noktası çiz (Sarı Çember)
        function drawTask(x, y) {
            ctx.beginPath();
            ctx.arc(x, y, 12, 0, Math.PI * 2);
            ctx.fillStyle = COLORS.task;
            ctx.fill();
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // Havalandırma çiz (Kırmızı Üçgen)
        function drawVent(x, y) {
            ctx.beginPath();
            ctx.moveTo(x, y - 15);
            ctx.lineTo(x - 15, y + 10);
            ctx.lineTo(x + 15, y + 10);
            ctx.closePath();
            ctx.fillStyle = COLORS.vent;
            ctx.fill();
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // Motor ateşi çiz
        function drawEngineThrust(x, y, scale=1) {
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.bezierCurveTo(x - 50*scale, y - 20*scale, x - 50*scale, y + 20*scale, x, y);
            ctx.fillStyle = COLORS.engine;
            ctx.fill();
            // İç parıltı
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.bezierCurveTo(x - 30*scale, y - 10*scale, x - 30*scale, y + 10*scale, x, y);
            ctx.fillStyle = 'white';
            ctx.fill();
        }

        // Metinleri çiz
        function drawText() {
            ctx.textAlign = "center";
            
            // Ana Başlık
            ctx.font = "bold 40px Arial";
            ctx.fillStyle = COLORS.textMain;
            ctx.fillText("Elektrik Hatası Düzeltildi", 600, 360);

            // Alt Başlık (Toplantı odası)
            ctx.font = "bold 25px Arial";
            ctx.fillStyle = COLORS.textSub;
            ctx.fillText("toplantı odası", 600, 390);

            // Açıklama
            ctx.font = "18px Arial";
            ctx.fillStyle = COLORS.textMain;
            ctx.fillText("(Düzgün Elektrik Panelleri Eklendi)", 600, 420);
        }

        // Ana Çizim Döngüsü
        function drawMap() {
            drawStarfield();

            ctx.save();
            ctx.translate(mapX, mapY);
            ctx.scale(mapScale, mapScale);

            // --- 1. ZEMİN VE KORİDORLAR (Koyu zemin) ---
            drawRoom([
                {x: 100, y: 100}, {x: 1100, y: 100}, {x: 1100, y: 500}, 
                {x: 700, y: 500}, {x: 700, y: 400}, {x: 500, y: 400},
                {x: 500, y: 500}, {x: 100, y: 500}
            ], COLORS.floorAlt, 'transparent');

            // --- 2. ODALAR VE DUVARLAR (Tam Geometri) ---

            // Sol Ana Motor Odası (Üst, Orta, Alt)
            drawRoom([
                {x: 70, y: 70}, {x: 250, y: 70}, {x: 250, y: 530}, {x: 70, y: 530},
                {x: 70, y: 450}, {x: 150, y: 450}, {x: 150, y: 350}, {x: 70, y: 350},
                {x: 70, y: 250}, {x: 150, y: 250}, {x: 150, y: 150}, {x: 70, y: 150}
            ], COLORS.floor, COLORS.wallOuter, 4);
            // Oda içi ayrım çizgileri (Motorlar)
            ctx.strokeStyle = COLORS.wallInner; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(150, 150); ctx.lineTo(250, 150); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(150, 250); ctx.lineTo(250, 250); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(150, 350); ctx.lineTo(250, 350); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(150, 450); ctx.lineTo(250, 450); ctx.stroke();

            // Üst Orta Oda (Güvenlik)
            drawRoom([
                {x: 250, y: 70}, {x: 600, y: 70}, {x: 600, y: 250}, {x: 450, y: 250}, {x: 450, y: 150}, {x: 250, y: 150}
            ], COLORS.floor, COLORS.wallOuter, 4);

            // Alt Orta Oda (Elektrik)
            drawRoom([
                {x: 250, y: 350}, {x: 450, y: 350}, {x: 450, y: 250}, {x: 600, y: 250}, {x: 600, y: 530}, {x: 250, y: 530}
            ], COLORS.floor, COLORS.wallOuter, 4);
            // Elektrik iç bölme
            ctx.beginPath(); ctx.moveTo(450, 350); ctx.lineTo(450, 530); ctx.stroke();

            // Sağ Üst Koridor ve Oda (Navigasyon yolu)
            drawRoom([
                {x: 600, y: 70}, {x: 1000, y: 70}, {x: 1000, y: 150}, {x: 750, y: 150}, {x: 750, y: 250}, {x: 600, y: 250}
            ], COLORS.floorAlt, COLORS.wallOuter, 4);

            // Sağ Alt Oda (Yönetim)
            drawRoom([
                {x: 700, y: 350}, {x: 900, y: 350}, {x: 900, y: 530}, {x: 700, y: 530}
            ], COLORS.floor, COLORS.wallOuter, 4);

            // En Sağ Oda (Navigasyon)
            drawRoom([
                {x: 900, y: 250}, {x: 1130, y: 250}, {x: 1130, y: 450}, {x: 900, y: 450}
            ], COLORS.floor, COLORS.wallOuter, 4);

            // --- 3. MERKEZİ TOPLANTI ODASI (Sarı Daire) ---
            ctx.beginPath();
            ctx.arc(600, 300, 100, 0, Math.PI * 2);
            ctx.fillStyle = COLORS.space; // İçerisi karanlık
            ctx.fill();
            ctx.strokeStyle = COLORS.wallOuter;
            ctx.lineWidth = 6;
            ctx.stroke();

            // --- 4. GÖREVLER (SARI) VE VENTLER (KIRMIZI) ---
            
            // Sol Motor Odası
            drawTask(100, 110); // Üst motor
            drawTask(100, 300); // Ana motor
            drawTask(100, 490); // Alt motor
            drawElectricSymbol(90, 300, 15); // Ana motor elektrik
            
            drawVent(170, 210); // Sol üst vent
            drawVent(170, 390); // Sol alt vent

            // Güvenlik (Üst orta)
            drawTask(350, 110);
            drawElectricSymbol(550, 150, 15);

            // Elektrik (Alt orta)
            drawTask(300, 400); // Büyük panel
            drawTask(400, 400); 
            drawTask(480, 500); 
            drawElectricSymbol(350, 450, 20); // Ana elektrik sembolü
            drawVent(300, 500);

            // Yönetim (Sağ alt)
            drawTask(750, 400);

            // Navigasyon (En sağ)
            drawTask(1080, 290);
            drawTask(1080, 410);
            drawElectricSymbol(1080, 350, 15);
            drawVent(950, 400);

            // --- 5. MOTOR EFEKTLERİ ---
            drawEngineThrust(70, 110, 0.8);
            drawEngineThrust(70, 300, 1.2);
            drawEngineThrust(70, 490, 0.8);

            // --- 6. METİNLER ---
            ctx.restore(); // Metinlerin ölçeklenmesini engellemek için (opsiyonel, görselde ölçekli duruyor)
            // ctx.save(); ctx.translate(mapX, mapY); ctx.scale(mapScale, mapScale); // Metinleri de ölçeklemek isterseniz bunu açın
            drawText();
            // ctx.restore();

            // --- OYUNCU ÇİZİMİ (Test için) ---
            ctx.save();
            ctx.translate(mapX, mapY);
            ctx.scale(mapScale, mapScale);
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
            ctx.fillStyle = player.color;
            ctx.fill();
            ctx.strokeStyle = 'black';
            ctx.stroke();
            ctx.restore();
        }

        // --- OYUN MANTIĞI VE DÖNGÜSÜ ---

        function update() {
            // Oyuncu Hareketi (Duvar çarpışması eklenmemiştir, basit hareket)
            let speed = 5;
            if (keys['w']) player.y -= speed;
            if (keys['s']) player.y += speed;
            if (keys['a']) player.x -= speed;
            if (keys['d']) player.x += speed;

            // Kamerayı oyuncuya odakla (Basit takip)
            // mapX = canvas.width / 2 - player.x * mapScale;
            // mapY = canvas.height / 2 - player.y * mapScale;
        }

        function gameLoop() {
            update();
            drawMap();
            requestAnimationFrame(gameLoop);
        }

        // Başlat
        gameLoop();

    </script>
</body>
</html>
