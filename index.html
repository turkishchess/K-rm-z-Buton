<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uzay Gemisi Haritası</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0b0e14;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        canvas {
            background: #0b0e14;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            border-radius: 8px;
        }
    </style>
</head>
<body>

<canvas id="map" width="1280" height="720"></canvas>

<script>
const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d');

// Renk Paleti
const C_BORDER = '#4a6288';
const C_FLOOR = '#1e2433';
const C_GRID = '#2a3245';
const C_TEXT = '#ffffff';
const C_RED = '#ff4757';
const C_BLUE = '#00d2ff';

// Uzay Yıldız Arka Planı
function drawStars() {
    ctx.fillStyle = '#0b0e14';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ffffff';
    for(let i = 0; i < 150; i++) {
        let x = (Math.sin(i * 99) * 0.5 + 0.5) * canvas.width;
        let y = (Math.cos(i * 33) * 0.5 + 0.5) * canvas.height;
        let r = (i % 3 === 0) ? 1.5 : 0.8;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
    }
}

// Oda Çizim Fonksiyonu (Düzgün Dikdörtgen & Izgara Zemin)
function drawRoom(x, y, w, h, label = "") {
    const bw = 10;
    // Dış Düzgün Duvarlar
    ctx.fillStyle = C_BORDER;
    ctx.fillRect(x - bw, y - bw, w + 2*bw, h + 2*bw);
    // İç Zemin
    ctx.fillStyle = C_FLOOR;
    ctx.fillRect(x, y, w, h);

    // Zemin Kare Karoları
    ctx.strokeStyle = C_GRID;
    ctx.lineWidth = 1;
    for(let gx = x + 40; gx < x + w; gx += 40) {
        ctx.beginPath(); ctx.moveTo(gx, y); ctx.lineTo(gx, y + h); ctx.stroke();
    }
    for(let gy = y + 40; gy < y + h; gy += 40) {
        ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x + w, gy); ctx.stroke();
    }

    // Oda Etiketi
    if(label) {
        ctx.font = 'bold 12px sans-serif';
        const txtWidth = ctx.measureText(label).width;
        ctx.fillStyle = '#121620';
        ctx.fillRect(x + w/2 - txtWidth/2 - 8, y + h/2 - 12, txtWidth + 16, 24);
        ctx.strokeStyle = C_BORDER;
        ctx.strokeRect(x + w/2 - txtWidth/2 - 8, y + h/2 - 12, txtWidth + 16, 24);
        ctx.fillStyle = C_TEXT;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, x + w/2, y + h/2);
    }
}

// Koridor Çizim Fonksiyonu
function drawCorridor(x1, y1, x2, y2, width = 65) {
    const bw = 10;
    ctx.fillStyle = C_BORDER;
    if(x1 === x2) { // Dikey
        const ymin = Math.min(y1, y2), ymax = Math.max(y1, y2);
        ctx.fillRect(x1 - width/2 - bw, ymin, width + 2*bw, ymax - ymin);
        ctx.fillStyle = C_FLOOR;
        ctx.fillRect(x1 - width/2, ymin - 2, width, ymax - ymin + 4);
    } else if(y1 === y2) { // Yatay
        const xmin = Math.min(x1, x2), xmax = Math.max(x1, x2);
        ctx.fillRect(xmin, y1 - width/2 - bw, xmax - xmin, width + 2*bw);
        ctx.fillStyle = C_FLOOR;
        ctx.fillRect(xmin - 2, y1 - width/2, xmax - xmin + 4, width);
    }
}

// Vent (Kırmızı Üçgen)
function drawVent(x, y, angle = 0) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle * Math.PI / 180);
    ctx.beginPath();
    ctx.moveTo(0, -14);
    ctx.lineTo(14, 12);
    ctx.lineTo(-14, 12);
    ctx.closePath();
    ctx.fillStyle = C_RED;
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
}

// Görev Noktası (Sarı Daire - Koyuluk Oranına Göre Zorluk Seviyesi)
// intensity: 0.3 (Kolay/Açık Sarı) -> 1.0 (Zor/Koyu Doygun Sarı)
function drawTask(x, y, intensity = 0.5) {
    ctx.beginPath();
    ctx.arc(x, y, 14, 0, Math.PI * 2);
    // Koyuluk / Parlaklık Oranı
    const alpha = 0.4 + intensity * 0.6;
    ctx.fillStyle = `rgba(255, 234, 167, ${alpha})`;
    ctx.fill();
    ctx.strokeStyle = `rgba(218, 165, 32, ${alpha})`;
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x, y, 6, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
}

// Motor Ateşi
function drawThruster(x, y) {
    ctx.beginPath();
    ctx.moveTo(x, y - 20);
    ctx.lineTo(x - 35, y);
    ctx.lineTo(x, y + 20);
    ctx.closePath();
    ctx.fillStyle = C_BLUE;
    ctx.fill();
}

function renderMap() {
    drawStars();

    // 1. DÜZGÜN KORİDORLAR
    drawCorridor(160, 360, 1120, 360, 70); // Ana Yatay
    drawCorridor(200, 110, 200, 610, 70); // Sol Dikey
    drawCorridor(200, 110, 500, 110, 70); // Sol Üst
    drawCorridor(200, 610, 500, 610, 70); // Sol Alt
    drawCorridor(500, 610, 920, 610, 70); // Sağ Alt Koridor
    drawCorridor(920, 360, 920, 610, 70);
    drawCorridor(670, 360, 670, 130, 70); // Üst Döngü
    drawCorridor(670, 130, 1120, 130, 70);
    drawCorridor(1120, 130, 1120, 360, 70);

    // 2. DÜZGÜN ODALAR
    drawRoom(50, 70, 180, 130, "ÜST MOTOR");
    drawRoom(50, 295, 180, 130, "ANA MOTOR");
    drawRoom(50, 520, 180, 130, "ALT MOTOR");
    
    drawRoom(380, 150, 200, 140, "GÜVENLİK");
    drawRoom(380, 430, 200, 140, "ELEKTRİK");
    
    drawRoom(800, 430, 200, 140, "YÖNETİM");
    drawRoom(1040, 295, 180, 130, "NAVİGASYON");

    // 3. MERKEZİ TOPLANTI ODASI (Tam Daire)
    const cx = 670, cy = 360;
    ctx.beginPath();
    ctx.arc(cx, cy, 110, 0, Math.PI * 2);
    ctx.fillStyle = C_BORDER;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx, cy, 95, 0, Math.PI * 2);
    ctx.fillStyle = '#181d29';
    ctx.fill();

    // Acil Durum Butonu
    ctx.beginPath();
    ctx.arc(cx, cy, 35, 0, Math.PI * 2);
    ctx.fillStyle = '#10121a';
    ctx.fill();
    ctx.strokeStyle = C_RED;
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx, cy, 18, 0, Math.PI * 2);
    ctx.fillStyle = C_RED;
    ctx.fill();

    // Toplantı Odası Yazısı
    ctx.font = 'bold 15px sans-serif';
    ctx.fillStyle = '#ffeaa7';
    ctx.textAlign = 'center';
    ctx.fillText("toplantı odası", cx, cy - 50);

    // 4. MOTOR ATEŞLERİ
    drawThruster(40, 135);
    drawThruster(40, 585);

    // 5. VENTLER (Kırmızı Üçgenler)
    drawVent(200, 220, 0);   // Sol Üst Vent
    drawVent(200, 500, 180); // Sol Alt Vent
    drawVent(420, 530, 90);  // Elektrik Venti
    drawVent(840, 530, -90); // Yönetim Venti

    // 6. GÖREVLER (Sarı Daireler - Koyuluk Oranları Ayarlı)
    drawTask(75, 95, 0.4);   // Düşük Görev
    drawTask(395, 175, 0.7); // Orta Görev
    drawTask(75, 320, 0.3);  // Düşük Görev
    drawTask(75, 545, 0.5);  // Orta Görev
    
    drawTask(400, 455, 0.9); // Koyu / Zor Görev
    drawTask(450, 455, 0.4); // Açık / Kolay Görev
    drawTask(400, 530, 1.0); // Çok Koyu / Çok Zor Görev
    
    drawTask(825, 455, 0.6); // Orta Görev
    drawTask(1185, 320, 0.8);// Zor Görev
    drawTask(1185, 405, 0.4);// Kolay Görev
}

renderMap();
</script>
</body>
</html>
